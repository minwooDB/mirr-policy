<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mirr. 관상 초대장</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f7f4ed; color: #1c1c1c;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 360px; width: 100%; text-align: center;
      background: #fcfbf8; border: 1px solid #eceae4; border-radius: 24px;
      padding: 36px 28px;
    }
    .emoji { font-size: 56px; margin-bottom: 8px; }
    .brand { font-size: 20px; font-weight: 700; color: #c49a6c; letter-spacing: -0.5px; margin-bottom: 18px; }
    h1 { font-size: 22px; letter-spacing: -0.6px; margin-bottom: 10px; line-height: 1.4; }
    p { font-size: 14px; color: #5f5f5d; line-height: 1.6; margin-bottom: 24px; }
    .gift { background: #1c1c1c; color: #fcfbf8; border-radius: 12px; padding: 12px; font-size: 13px; margin-bottom: 24px; }
    .btn {
      display: block; width: 100%; background: #1c1c1c; color: #fcfbf8;
      text-decoration: none; padding: 16px; border-radius: 9999px;
      font-size: 15px; font-weight: 600; margin-bottom: 10px;
    }
    .sub { font-size: 12px; color: #9f9d98; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🔮</div>
    <div class="brand">mirr.</div>
    <h1>친구가 관상을<br/>선물했어요</h1>
    <p>AI가 읽어주는 한국 전통 관상.<br/>총운과 부위별 관상을 확인해보세요.</p>
    <div class="gift">🎁 관상 1회권이 준비되어 있어요</div>
    <a id="openBtn" class="btn" href="#">앱에서 관상 보기</a>
    <p class="sub">앱이 없다면 설치 후 자동으로 열려요</p>
  </div>

  <script>
    // 코드 추출
    var params = new URLSearchParams(location.search);
    var code = params.get('code') || '';

    // 앱 딥링크 / 스토어 링크
    var APP_SCHEME = 'mirr://invite?code=' + encodeURIComponent(code);
    var PLAY_URL = 'https://play.google.com/store/apps/details?id=com.lmw.mirr.android.google.global.normal';
    var APPSTORE_URL = 'https://apps.apple.com/app/idYOUR_APP_ID'; // TODO: 출시 후 실제 ID

    function storeUrl() {
      var ua = navigator.userAgent || '';
      if (/iPhone|iPad|iPod/i.test(ua)) return APPSTORE_URL;
      return PLAY_URL;
    }

    var btn = document.getElementById('openBtn');
    btn.href = APP_SCHEME;

    // 버튼 클릭: 앱 열기 시도 → 실패 시 스토어
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      var clicked = Date.now();
      // 앱 열기 시도
      window.location = APP_SCHEME;
      // 1.2초 내 앱이 안 열리면 스토어로
      setTimeout(function () {
        if (Date.now() - clicked < 1600) window.location = storeUrl();
      }, 1200);
    });

    // 자동 시도 (앱 설치된 경우 바로 열림)
    setTimeout(function () { window.location = APP_SCHEME; }, 400);
  </script>
</body>
</html>
